services:
  - type: web
    name: ledger-app
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: LEDGER_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: ledger-db
    plan: free
